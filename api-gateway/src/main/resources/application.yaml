spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: restaurant-service
              uri: http://localhost:8081
              predicates:
                - Path=/restaurants/**

            - id: menu-service
              uri: http://localhost:8082
              predicates:
                - Path=/menu-items/**

            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/auth/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/payments/**

            - id: delivery-service
              uri: http://localhost:8086
              predicates:
                - Path=/deliveries/**

            - id: notification-service
              uri: http://localhost:8087
              predicates:
                - Path=/notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info