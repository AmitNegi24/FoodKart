spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: restaurant-service
              uri: ${RESTAURANT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/restaurants/**
              filters:
                - AddCorrelationId

            - id: menu-service
              uri: ${MENU_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/menu-items/**
              filters:
                - AddCorrelationId

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/auth/**
              filters:
                - AddCorrelationId

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/orders/**
              filters:
                - AddCorrelationId

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/payments/**
              filters:
                - AddCorrelationId

            - id: delivery-service
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/deliveries/**
              filters:
                - AddCorrelationId

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/notifications/**
              filters:
                - AddCorrelationId

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info