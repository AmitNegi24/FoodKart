spring:
  application:
    name: restaurant-service

  profiles:
    default: local

  data:
    web:
      pageable:
        page-serialization-mode: via-dto

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8081
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: health,info