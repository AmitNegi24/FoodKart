apiVersion: apps/v1
kind: Deployment

metadata:
  name: restaurant-service
  namespace: foodkart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: restaurant-service

  template:
    metadata:
      labels:
        app: restaurant-service

    spec:
      containers:
        - name: restaurant-service
          image: foodkart-restaurant-service:latest
          envFrom:
            - configMapRef:
                name: restaurant-config
            - secretRef:
                name: restaurant-secret


          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: restaurant-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3